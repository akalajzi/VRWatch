name: Privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: guard
          sparse-checkout: scripts
      - run: python3 guard/scripts/setup-privacy.py --repo source --scanner-only
      - run: python3 guard/scripts/privacy-check.py --repo source --history HEAD
